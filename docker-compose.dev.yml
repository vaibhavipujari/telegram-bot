clsversion: '3.8'

services:
  # Development overrides for link-server
  link-server:
    environment:
      - NODE_ENV=development
      - DEBUG=*
      - HOST=localhost
      - PORT=3000
      
      # File Upload Configuration (Development)
      - MAX_FILE_SIZE=104857600
      
      # Rate Limiting Configuration (More lenient for development)
      - RATE_LIMIT_WINDOW=900000
      - RATE_LIMIT_MAX=100
      - REQUIRE_DEVICE_REGISTRATION=false
      - ENABLE_ANALYTICS=true
      
      # App Store Configuration
      - IOS_APP_STORE_URL=https://apps.apple.com/app/id123456789
      - ANDROID_PLAY_STORE_URL=https://play.google.com/store/apps/details?id=com.yourapp
      - IOS_APP_STORE_ID=123456789
      
      # CORS Configuration (Allow all for development)
      - CORS_ORIGINS=*
      
      # Admin Authentication Configuration (Development)
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin123
      - JWT_SECRET=dev-jwt-secret-key-not-for-production
      - JWT_EXPIRES_IN=24h
      - SESSION_TIMEOUT=86400000
      - MAX_LOGIN_ATTEMPTS=5
      - LOCKOUT_DURATION=900000
      
      # MongoDB Atlas Configuration for Development
      - MONGODB_URI=mongodb+srv://brighthex28_db_user:paxb1lgQ9oT4Wrob@cluster0.lzhww6m.mongodb.net/linkserver?retryWrites=true&w=majority&appName=Cluster0
      - MONGODB_DB_NAME=linkserver
    volumes:
      # Mount source code for live reloading
      - .:/app
      - /app/node_modules
      - apk_storage:/app/uploads
      - ./uploads:/app/uploads-local
    command: npm run dev
    stdin_open: true
    tty: true

  # MongoDB Atlas - No local MongoDB service needed in development
