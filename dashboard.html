<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APK Download Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .content {
            padding: 30px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            border-left: 4px solid #4facfe;
        }
        
        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #333;
        }
        
        .stat-label {
            color: #666;
            margin-top: 5px;
        }
        
        .apps-grid {
            display: grid;
            gap: 20px;
        }
        
        .app-card {
            background: #fff;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .app-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .app-name {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
        }
        
        .app-platform {
            background: #4facfe;
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8em;
        }
        
        .app-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .info-item {
            text-align: center;
        }
        
        .info-label {
            font-size: 0.8em;
            color: #666;
            margin-bottom: 5px;
        }
        
        .info-value {
            font-weight: bold;
            color: #333;
        }
        
        .download-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        
        .btn-primary {
            background: #4facfe;
            color: white;
        }
        
        .btn-primary:hover {
            background: #3d8bfe;
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #545b62;
        }
        
        .btn-success {
            background: #28a745;
            color: white;
        }
        
        .btn-success:hover {
            background: #218838;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            color: #666;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        
        .refresh-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #4facfe;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 1.5em;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: all 0.2s;
        }
        
        .refresh-btn:hover {
            transform: scale(1.1);
            background: #3d8bfe;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .dashboard-content {
            display: none;
        }
        
        .dashboard-content.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📱 APK Download Dashboard</h1>
            <p>Fast and secure APK downloads</p>
        </div>
        
        <!-- Loading indicator -->
        <div id="loadingIndicator" style="display: block; text-align: center; padding: 50px;">
            <div style="display: inline-block; width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #667eea; border-radius: 50%; animation: spin 1s linear infinite;"></div>
            <p style="margin-top: 20px; color: #666;">Authenticating...</p>
        </div>
        
        <div class="content dashboard-content" id="dashboardContent">
            <div class="stats" id="stats">
                <div class="stat-card">
                    <div class="stat-number" id="totalApps">-</div>
                    <div class="stat-label">Total Apps</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="totalDownloads">-</div>
                    <div class="stat-label">Total Downloads</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="activeChannels">-</div>
                    <div class="stat-label">Active Channels</div>
                </div>
            </div>
            
            <div id="content">
                <div class="loading">
                    <h3>Loading apps...</h3>
                </div>
            </div>
        </div>
    </div>
    
    <button class="refresh-btn" onclick="loadData()" title="Refresh">
        🔄
    </button>

    <script>
        // Authentication management
        class AuthManager {
            static getToken() {
                return localStorage.getItem('adminToken');
            }
            
            static getTokenExpiry() {
                return localStorage.getItem('adminTokenExpiry');
            }
            
            static isAuthenticated() {
                const token = this.getToken();
                const expiry = this.getTokenExpiry();
                
                if (!token || !expiry) return false;
                
                // Check if token is expired
                if (Date.now() >= parseInt(expiry)) {
                    this.clearAuth();
                    return false;
                }
                
                return true;
            }
            
            static clearAuth() {
                localStorage.removeItem('adminToken');
                localStorage.removeItem('adminTokenExpiry');
                localStorage.removeItem('adminUser');
            }
            
            static redirectToLogin() {
                window.location.href = '/login';
            }
            
            static async verifyToken() {
                const token = this.getToken();
                if (!token) {
                    console.log('No token found for verification');
                    this.redirectToLogin();
                    return false;
                }
                
                try {
                    console.log('Verifying token with server...');
                    const response = await fetch('/api/auth/me', {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        console.log('Token verification successful:', data.user);
                        return true;
                    } else {
                        console.log('Token verification failed, status:', response.status);
                        this.clearAuth();
                        this.redirectToLogin();
                        return false;
                    }
                } catch (error) {
                    console.error('Token verification network error:', error);
                    // Don't redirect on network errors, just return false
                    return false;
                }
            }
            
            static getAuthHeaders() {
                const token = this.getToken();
                return token ? {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                } : {
                    'Content-Type': 'application/json'
                };
            }
        }

        // Show/hide loading indicator
        function showLoading(message = 'Loading...') {
            const loadingIndicator = document.getElementById('loadingIndicator');
            const dashboardContent = document.getElementById('dashboardContent');
            
            if (loadingIndicator) {
                loadingIndicator.style.display = 'block';
                loadingIndicator.querySelector('p').textContent = message;
            }
            
            if (dashboardContent) {
                dashboardContent.classList.remove('show');
            }
        }
        
        function hideLoading() {
            const loadingIndicator = document.getElementById('loadingIndicator');
            const dashboardContent = document.getElementById('dashboardContent');
            
            if (loadingIndicator) {
                loadingIndicator.style.display = 'none';
            }
            
            if (dashboardContent) {
                dashboardContent.classList.add('show');
            }
        }

        // Check authentication on page load
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('Dashboard loading...');
            showLoading('Authenticating...');
            
            // First check if we have a token in localStorage
            if (!AuthManager.isAuthenticated()) {
                console.log('No valid token found, redirecting to login');
                showLoading('Redirecting to login...');
                setTimeout(() => {
                    AuthManager.redirectToLogin();
                }, 500);
                return;
            }
            
            console.log('Token found, verifying with server...');
            showLoading('Verifying credentials...');
            
            // Verify token with server
            try {
                const isValid = await AuthManager.verifyToken();
                if (!isValid) {
                    console.log('Token verification failed');
                    showLoading('Authentication failed, redirecting...');
                    setTimeout(() => {
                        AuthManager.redirectToLogin();
                    }, 1000);
                    return;
                }
                
                console.log('Authentication successful, loading dashboard');
                showLoading('Loading dashboard data...');
                
                // Add logout functionality
                addLogoutButton();
                
                // Load dashboard data
                await loadData();
                
                // Hide loading and show dashboard
                hideLoading();
                
            } catch (error) {
                console.error('Authentication error:', error);
                showLoading('Authentication error, redirecting...');
                AuthManager.clearAuth();
                setTimeout(() => {
                    AuthManager.redirectToLogin();
                }, 1000);
            }
        });

        function addLogoutButton() {
            const header = document.querySelector('.header');
            
            // Create navigation container
            const navContainer = document.createElement('div');
            navContainer.style.cssText = `
                position: absolute;
                top: 20px;
                right: 20px;
                display: flex;
                gap: 10px;
            `;
            
            // Upload button
            const uploadBtn = document.createElement('a');
            uploadBtn.href = '/upload';
            uploadBtn.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> Upload';
            
            // Channels button
            const channelsBtn = document.createElement('a');
            channelsBtn.href = '/channels';
            channelsBtn.innerHTML = '<i class="fas fa-broadcast-tower"></i> Channels';
            const buttonStyle = `
                background: rgba(255, 255, 255, 0.2);
                color: white;
                border: 1px solid rgba(255, 255, 255, 0.3);
                padding: 10px 15px;
                border-radius: 5px;
                cursor: pointer;
                font-size: 14px;
                text-decoration: none;
                transition: all 0.3s ease;
                display: flex;
                align-items: center;
                gap: 5px;
            `;
            
            uploadBtn.style.cssText = buttonStyle;
            channelsBtn.style.cssText = buttonStyle;
            
            // Logout button
            const logoutBtn = document.createElement('button');
            logoutBtn.innerHTML = '<i class="fas fa-sign-out-alt"></i> Logout';
            logoutBtn.style.cssText = `
                background: rgba(255, 255, 255, 0.2);
                color: white;
                border: 1px solid rgba(255, 255, 255, 0.3);
                padding: 10px 15px;
                border-radius: 5px;
                cursor: pointer;
                font-size: 14px;
                transition: all 0.3s ease;
                display: flex;
                align-items: center;
                gap: 5px;
            `;
            
            // Add hover effects
            [uploadBtn, channelsBtn].forEach(btn => {
                btn.addEventListener('mouseover', () => {
                    btn.style.background = 'rgba(255, 255, 255, 0.3)';
                });
                
                btn.addEventListener('mouseout', () => {
                    btn.style.background = 'rgba(255, 255, 255, 0.2)';
                });
            });
            
            logoutBtn.addEventListener('mouseover', () => {
                logoutBtn.style.background = 'rgba(255, 255, 255, 0.3)';
            });
            
            logoutBtn.addEventListener('mouseout', () => {
                logoutBtn.style.background = 'rgba(255, 255, 255, 0.2)';
            });
            
            logoutBtn.addEventListener('click', async () => {
                try {
                    await fetch('/api/auth/logout', {
                        method: 'POST',
                        headers: AuthManager.getAuthHeaders()
                    });
                } catch (error) {
                    console.error('Logout error:', error);
                }
                
                AuthManager.clearAuth();
                AuthManager.redirectToLogin();
            });
            
            // Add buttons to navigation container
            navContainer.appendChild(uploadBtn);
            navContainer.appendChild(channelsBtn);
            navContainer.appendChild(logoutBtn);
            
            header.style.position = 'relative';
            header.appendChild(navContainer);
        }

        async function loadData() {
            try {
                console.log('Loading dashboard data...');
                
                // Load stats
                const statsResponse = await fetch('/api/stats', {
                    headers: AuthManager.getAuthHeaders()
                });
                
                if (statsResponse.status === 401 || statsResponse.status === 403) {
                    console.log('Authentication failed during API call');
                    AuthManager.clearAuth();
                    AuthManager.redirectToLogin();
                    return;
                }
                
                const stats = await statsResponse.json();
                
                if (stats.success) {
                    document.getElementById('totalDownloads').textContent = stats.totalDownloads || 0;
                    document.getElementById('activeChannels').textContent = stats.activeChannels || 0;
                }
                
                // Load apps
                const appsResponse = await fetch('/api/apps', {
                    headers: AuthManager.getAuthHeaders()
                });
                
                if (appsResponse.status === 401 || appsResponse.status === 403) {
                    console.log('Authentication failed during API call');
                    AuthManager.clearAuth();
                    AuthManager.redirectToLogin();
                    return;
                }
                
                const appsData = await appsResponse.json();
                
                if (appsData.success) {
                    document.getElementById('totalApps').textContent = appsData.totalApps || 0;
                    displayApps(appsData.apps);
                } else {
                    throw new Error(appsData.message);
                }
            } catch (error) {
                document.getElementById('content').innerHTML = `
                    <div class="error">
                        <strong>Error:</strong> ${error.message}
                    </div>
                `;
            }
        }
        
        function displayApps(apps) {
            const content = document.getElementById('content');
            
            if (apps.length === 0) {
                content.innerHTML = `
                    <div class="loading">
                        <h3>No apps uploaded yet</h3>
                        <p>Upload your first APK to get started!</p>
                    </div>
                `;
                return;
            }
            
            const appsHtml = apps.map(app => `
                <div class="app-card">
                    <div class="app-header">
                        <div class="app-name">${app.name}</div>
                        <div class="app-platform">${app.platform.toUpperCase()}</div>
                    </div>
                    
                    <div class="app-info">
                        <div class="info-item">
                            <div class="info-label">Latest Version</div>
                            <div class="info-value">${app.latestVersion}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Total Versions</div>
                            <div class="info-value">${app.totalVersions}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Downloads</div>
                            <div class="info-value">${app.totalDownloads}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">File Size</div>
                            <div class="info-value">${formatFileSize(app.fileSize)}</div>
                        </div>
                    </div>
                    
                    <div class="download-buttons">
                        <a href="${app.downloadUrl}" class="btn btn-primary">
                            ⚡ Fast Download
                        </a>
                        <a href="${app.versionsUrl}" class="btn btn-secondary">
                            📋 All Versions
                        </a>
                        <button onclick="copyToClipboard('${app.downloadUrl}')" class="btn btn-success">
                            📋 Copy Link
                        </button>
                    </div>
                </div>
            `).join('');
            
            content.innerHTML = `<div class="apps-grid">${appsHtml}</div>`;
        }
        
        function formatFileSize(bytes) {
            if (!bytes) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
        
        async function copyToClipboard(text) {
            try {
                await navigator.clipboard.writeText(text);
                alert('Download link copied to clipboard!');
            } catch (err) {
                // Fallback for older browsers
                const textArea = document.createElement('textarea');
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                alert('Download link copied to clipboard!');
            }
        }
        
        // Load data on page load
        loadData();
        
        // Auto-refresh every 30 seconds
        setInterval(loadData, 30000);
    </script>
</body>
</html>
