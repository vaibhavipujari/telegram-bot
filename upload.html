<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APK Upload Manager - Link Server</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            position: relative;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2, #f093fb, #f5576c);
            background-size: 400% 400%;
            animation: gradient 3s ease infinite;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .nav-buttons {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 30px;
        }

        .upload-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            border: 2px dashed #dee2e6;
            transition: all 0.3s ease;
        }

        .upload-section.dragover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.05);
            transform: scale(1.02);
        }

        .upload-area {
            text-align: center;
            padding: 40px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .upload-icon {
            font-size: 4em;
            color: #667eea;
            margin-bottom: 20px;
        }

        .upload-text {
            font-size: 1.2em;
            color: #333;
            margin-bottom: 10px;
        }

        .upload-subtext {
            color: #666;
            font-size: 0.9em;
        }

        .file-input {
            display: none;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .progress-container {
            margin-top: 20px;
            display: none;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }

        .file-preview {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            border: 1px solid #dee2e6;
            display: none;
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .file-icon {
            font-size: 2em;
            color: #28a745;
        }

        .file-details h4 {
            margin: 0 0 5px 0;
            color: #333;
        }

        .file-details p {
            margin: 0;
            color: #666;
            font-size: 14px;
        }

        .apps-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-height: 600px;
            overflow-y: auto;
        }

        .section-title {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .app-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid #dee2e6;
            transition: all 0.3s ease;
        }

        .app-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .app-header {
            display: flex;
            justify-content: between;
            align-items: center;
            margin-bottom: 10px;
        }

        .app-name {
            font-weight: 600;
            color: #333;
            font-size: 1.1em;
        }

        .app-version {
            background: #667eea;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        .app-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-item {
            text-align: center;
            padding: 10px;
            background: white;
            border-radius: 6px;
        }

        .stat-value {
            font-weight: 600;
            color: #667eea;
            font-size: 1.1em;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 2px;
        }

        .app-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 10px;
        }

        .alert-success {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        .alert-error {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .alert-warning {
            background-color: #fff3cd;
            border: 1px solid #ffeaa7;
            color: #856404;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loading-content {
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .channels-section {
            grid-column: span 2;
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-top: 30px;
        }

        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .channel-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            border: 1px solid #dee2e6;
        }

        .channel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .channel-name {
            font-weight: 600;
            color: #333;
        }

        .channel-status {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-active {
            background: #d4edda;
            color: #155724;
        }

        .status-inactive {
            background: #f8d7da;
            color: #721c24;
        }

        .channel-stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 14px;
            color: #666;
        }

        .channel-actions {
            display: flex;
            gap: 10px;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .channels-section {
                grid-column: span 1;
            }
            
            .nav-buttons {
                position: static;
                justify-content: center;
                margin-top: 20px;
            }
            
            .header {
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="nav-buttons">
                <a href="/dashboard" class="nav-btn">
                    <i class="fas fa-tachometer-alt"></i>
                    Dashboard
                </a>
                <a href="/channels" class="nav-btn">
                    <i class="fas fa-broadcast-tower"></i>
                    Channels
                </a>
                <button class="nav-btn" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i>
                    Logout
                </button>
            </div>
            <h1><i class="fas fa-cloud-upload-alt"></i> APK Upload Manager</h1>
            <p>Upload and manage your Android applications</p>
        </div>

        <div id="alertContainer"></div>

        <div class="main-content">
            <!-- Upload Section -->
            <div class="upload-section" id="uploadSection">
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">
                        <i class="fas fa-cloud-upload-alt"></i>
                    </div>
                    <div class="upload-text">Drag & Drop APK File Here</div>
                    <div class="upload-subtext">or click to browse files</div>
                    <input type="file" id="fileInput" class="file-input" accept=".apk,.ipa" />
                </div>

                <div class="file-preview" id="filePreview">
                    <div class="file-info">
                        <div class="file-icon">
                            <i class="fab fa-android"></i>
                        </div>
                        <div class="file-details">
                            <h4 id="fileName">app.apk</h4>
                            <p id="fileSize">0 MB</p>
                        </div>
                    </div>
                </div>

                <form id="uploadForm">
                    <div class="form-group">
                        <label for="appName">App Name</label>
                        <input type="text" id="appName" class="form-control" placeholder="Enter app name" required>
                    </div>

                    <div class="form-group">
                        <label for="version">Version</label>
                        <input type="text" id="version" class="form-control" placeholder="e.g., 1.0.0" pattern="^\d+\.\d+\.\d+$" required>
                    </div>

                    <div class="form-group">
                        <label for="platform">Platform</label>
                        <select id="platform" class="form-control" required>
                            <option value="">Select Platform</option>
                            <option value="android">Android</option>
                            <option value="ios">iOS</option>
                            <option value="both">Both</option>
                        </select>
                    </div>

                    <div class="progress-container" id="progressContainer">
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <div class="progress-text" id="progressText">Uploading... 0%</div>
                    </div>

                    <button type="submit" class="btn btn-primary" id="uploadBtn">
                        <i class="fas fa-upload"></i>
                        Upload APK
                    </button>
                </form>
            </div>

            <!-- Apps Management Section -->
            <div class="apps-section">
                <div class="section-title">
                    <i class="fas fa-mobile-alt"></i>
                    Uploaded Apps
                    <button class="btn btn-secondary btn-sm" onclick="loadApps()" style="margin-left: auto;">
                        <i class="fas fa-sync-alt"></i>
                        Refresh
                    </button>
                </div>
                <div id="appsList">
                    <div class="text-center" style="padding: 40px; color: #666;">
                        <i class="fas fa-spinner fa-spin" style="font-size: 2em; margin-bottom: 15px;"></i>
                        <p>Loading apps...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Channels Management Section -->
        <div class="channels-section">
            <div class="section-title">
                <i class="fas fa-broadcast-tower"></i>
                Download Channels
                <button class="btn btn-primary btn-sm" onclick="showAddChannelModal()" style="margin-left: auto;">
                    <i class="fas fa-plus"></i>
                    Add Channel
                </button>
            </div>
            <div class="channels-grid" id="channelsList">
                <div class="text-center" style="padding: 40px; color: #666; grid-column: span 3;">
                    <i class="fas fa-spinner fa-spin" style="font-size: 2em; margin-bottom: 15px;"></i>
                    <p>Loading channels...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <h3>Processing...</h3>
            <p id="loadingText">Please wait while we process your request</p>
        </div>
    </div>

    <script>
        // Authentication management
        class AuthManager {
            static getToken() {
                return localStorage.getItem('adminToken');
            }
            
            static getTokenExpiry() {
                return localStorage.getItem('adminTokenExpiry');
            }
            
            static isAuthenticated() {
                const token = this.getToken();
                const expiry = this.getTokenExpiry();
                
                if (!token || !expiry) return false;
                
                if (Date.now() >= parseInt(expiry)) {
                    this.clearAuth();
                    return false;
                }
                
                return true;
            }
            
            static clearAuth() {
                localStorage.removeItem('adminToken');
                localStorage.removeItem('adminTokenExpiry');
                localStorage.removeItem('adminUser');
            }
            
            static redirectToLogin() {
                window.location.href = '/login';
            }
            
            static getAuthHeaders() {
                const token = this.getToken();
                return token ? {
                    'Authorization': `Bearer ${token}`
                } : {};
            }
        }

        // Upload Manager
        class UploadManager {
            constructor() {
                this.uploadArea = document.getElementById('uploadArea');
                this.uploadSection = document.getElementById('uploadSection');
                this.fileInput = document.getElementById('fileInput');
                this.filePreview = document.getElementById('filePreview');
                this.uploadForm = document.getElementById('uploadForm');
                this.progressContainer = document.getElementById('progressContainer');
                this.progressFill = document.getElementById('progressFill');
                this.progressText = document.getElementById('progressText');
                
                this.selectedFile = null;
                
                this.initializeEventListeners();
            }
            
            initializeEventListeners() {
                // Drag and drop events
                this.uploadArea.addEventListener('click', () => this.fileInput.click());
                this.uploadArea.addEventListener('dragover', (e) => this.handleDragOver(e));
                this.uploadArea.addEventListener('dragleave', (e) => this.handleDragLeave(e));
                this.uploadArea.addEventListener('drop', (e) => this.handleDrop(e));
                
                // File input change
                this.fileInput.addEventListener('change', (e) => this.handleFileSelect(e));
                
                // Form submission
                this.uploadForm.addEventListener('submit', (e) => this.handleUpload(e));
            }
            
            handleDragOver(e) {
                e.preventDefault();
                this.uploadSection.classList.add('dragover');
            }
            
            handleDragLeave(e) {
                e.preventDefault();
                this.uploadSection.classList.remove('dragover');
            }
            
            handleDrop(e) {
                e.preventDefault();
                this.uploadSection.classList.remove('dragover');
                
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    this.processFile(files[0]);
                }
            }
            
            handleFileSelect(e) {
                const files = e.target.files;
                if (files.length > 0) {
                    this.processFile(files[0]);
                }
            }
            
            processFile(file) {
                // Validate file type
                const validTypes = ['.apk', '.ipa'];
                const fileExtension = '.' + file.name.split('.').pop().toLowerCase();
                
                if (!validTypes.includes(fileExtension)) {
                    showAlert('Invalid file type. Please select an APK or IPA file.', 'error');
                    return;
                }
                
                // Validate file size (100MB max)
                const maxSize = 100 * 1024 * 1024; // 100MB
                if (file.size > maxSize) {
                    showAlert('File too large. Maximum size is 100MB.', 'error');
                    return;
                }
                
                this.selectedFile = file;
                this.showFilePreview(file);
                
                // Auto-fill form fields
                const fileName = file.name.replace(/\.[^/.]+$/, ""); // Remove extension
                document.getElementById('appName').value = fileName;
                
                // Set platform based on file extension
                const platform = fileExtension === '.apk' ? 'android' : 'ios';
                document.getElementById('platform').value = platform;
            }
            
            showFilePreview(file) {
                document.getElementById('fileName').textContent = file.name;
                document.getElementById('fileSize').textContent = this.formatFileSize(file.size);
                this.filePreview.style.display = 'block';
            }
            
            formatFileSize(bytes) {
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }
            
            async handleUpload(e) {
                e.preventDefault();
                
                if (!this.selectedFile) {
                    showAlert('Please select a file to upload.', 'error');
                    return;
                }
                
                const formData = new FormData();
                formData.append('apkFile', this.selectedFile);
                formData.append('appName', document.getElementById('appName').value);
                formData.append('version', document.getElementById('version').value);
                formData.append('platform', document.getElementById('platform').value);
                
                this.showProgress();
                
                try {
                    const xhr = new XMLHttpRequest();
                    
                    // Upload progress
                    xhr.upload.addEventListener('progress', (e) => {
                        if (e.lengthComputable) {
                            const percentComplete = (e.loaded / e.total) * 100;
                            this.updateProgress(percentComplete);
                        }
                    });
                    
                    // Upload complete
                    xhr.addEventListener('load', () => {
                        this.hideProgress();
                        
                        if (xhr.status === 200) {
                            const response = JSON.parse(xhr.responseText);
                            if (response.success) {
                                showAlert('APK uploaded successfully!', 'success');
                                this.resetForm();
                                loadApps(); // Refresh apps list
                            } else {
                                showAlert(response.message || 'Upload failed', 'error');
                            }
                        } else {
                            showAlert('Upload failed. Please try again.', 'error');
                        }
                    });
                    
                    // Upload error
                    xhr.addEventListener('error', () => {
                        this.hideProgress();
                        showAlert('Upload failed. Please check your connection.', 'error');
                    });
                    
                    // Send request
                    xhr.open('POST', '/upload');
                    
                    // Add auth header
                    const token = AuthManager.getToken();
                    if (token) {
                        xhr.setRequestHeader('Authorization', `Bearer ${token}`);
                    }
                    
                    xhr.send(formData);
                    
                } catch (error) {
                    this.hideProgress();
                    showAlert('Upload failed: ' + error.message, 'error');
                }
            }
            
            showProgress() {
                this.progressContainer.style.display = 'block';
                document.getElementById('uploadBtn').disabled = true;
            }
            
            hideProgress() {
                this.progressContainer.style.display = 'none';
                document.getElementById('uploadBtn').disabled = false;
            }
            
            updateProgress(percent) {
                this.progressFill.style.width = percent + '%';
                this.progressText.textContent = `Uploading... ${Math.round(percent)}%`;
            }
            
            resetForm() {
                this.uploadForm.reset();
                this.filePreview.style.display = 'none';
                this.selectedFile = null;
                this.fileInput.value = '';
            }
        }

        // Utility functions
        function showAlert(message, type = 'info') {
            const alertContainer = document.getElementById('alertContainer');
            
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-triangle' : 'info-circle'}"></i>
                ${message}
            `;
            
            alertContainer.appendChild(alert);
            alert.style.display = 'flex';
            
            // Auto-hide after 5 seconds
            setTimeout(() => {
                alert.remove();
            }, 5000);
        }

        function showLoading(text = 'Processing...') {
            document.getElementById('loadingText').textContent = text;
            document.getElementById('loadingOverlay').style.display = 'flex';
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        // API functions
        async function apiCall(url, options = {}) {
            const defaultOptions = {
                headers: {
                    'Content-Type': 'application/json',
                    ...AuthManager.getAuthHeaders()
                }
            };
            
            const response = await fetch(url, { ...defaultOptions, ...options });
            
            if (response.status === 401 || response.status === 403) {
                AuthManager.clearAuth();
                AuthManager.redirectToLogin();
                return null;
            }
            
            return response;
        }

        // Load apps
        async function loadApps() {
            try {
                const response = await apiCall('/api/apps');
                if (!response) return;
                
                const data = await response.json();
                
                if (data.success) {
                    displayApps(data.apps);
                } else {
                    document.getElementById('appsList').innerHTML = `
                        <div class="text-center" style="padding: 40px; color: #666;">
                            <i class="fas fa-exclamation-triangle" style="font-size: 2em; margin-bottom: 15px;"></i>
                            <p>Failed to load apps</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading apps:', error);
                document.getElementById('appsList').innerHTML = `
                    <div class="text-center" style="padding: 40px; color: #666;">
                        <i class="fas fa-exclamation-triangle" style="font-size: 2em; margin-bottom: 15px;"></i>
                        <p>Error loading apps</p>
                    </div>
                `;
            }
        }

        function displayApps(apps) {
            const appsList = document.getElementById('appsList');
            
            if (!apps || apps.length === 0) {
                appsList.innerHTML = `
                    <div class="text-center" style="padding: 40px; color: #666;">
                        <i class="fas fa-mobile-alt" style="font-size: 2em; margin-bottom: 15px;"></i>
                        <p>No apps uploaded yet</p>
                    </div>
                `;
                return;
            }
            
            appsList.innerHTML = apps.map(app => `
                <div class="app-card">
                    <div class="app-header">
                        <div class="app-name">${app.name}</div>
                        <div class="app-version">v${app.latestVersion}</div>
                    </div>
                    <div class="app-stats">
                        <div class="stat-item">
                            <div class="stat-value">${app.totalVersions}</div>
                            <div class="stat-label">Versions</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">${app.totalDownloads}</div>
                            <div class="stat-label">Downloads</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">${formatFileSize(app.fileSize)}</div>
                            <div class="stat-label">Size</div>
                        </div>
                    </div>
                    <div class="app-actions">
                        <button class="btn btn-primary btn-sm" onclick="downloadApp('${app.platform}')">
                            <i class="fas fa-download"></i>
                            Download
                        </button>
                        <button class="btn btn-secondary btn-sm" onclick="viewVersions('${app.name}')">
                            <i class="fas fa-history"></i>
                            Versions
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Load channels
        async function loadChannels() {
            try {
                const response = await apiCall('/api/channels');
                if (!response) return;
                
                const data = await response.json();
                
                if (data.success) {
                    displayChannels(data.channels);
                } else {
                    document.getElementById('channelsList').innerHTML = `
                        <div class="text-center" style="padding: 40px; color: #666; grid-column: span 3;">
                            <i class="fas fa-exclamation-triangle" style="font-size: 2em; margin-bottom: 15px;"></i>
                            <p>Failed to load channels</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading channels:', error);
            }
        }

        function displayChannels(channels) {
            const channelsList = document.getElementById('channelsList');
            
            if (!channels || channels.length === 0) {
                channelsList.innerHTML = `
                    <div class="text-center" style="padding: 40px; color: #666; grid-column: span 3;">
                        <i class="fas fa-broadcast-tower" style="font-size: 2em; margin-bottom: 15px;"></i>
                        <p>No channels created yet</p>
                    </div>
                `;
                return;
            }
            
            channelsList.innerHTML = channels.map(channel => `
                <div class="channel-card">
                    <div class="channel-header">
                        <div class="channel-name">${channel.channelName}</div>
                        <div class="channel-status ${channel.isActive ? 'status-active' : 'status-inactive'}">
                            ${channel.isActive ? 'Active' : 'Inactive'}
                        </div>
                    </div>
                    <div class="channel-stats">
                        <span>Downloads: ${channel.downloadCount}</span>
                        <span>ID: ${channel.channelId}</span>
                    </div>
                    <div class="channel-actions">
                        <button class="btn btn-primary btn-sm" onclick="copyDownloadLink('${channel.downloadToken}')">
                            <i class="fas fa-copy"></i>
                            Copy Link
                        </button>
                        <button class="btn btn-secondary btn-sm" onclick="toggleChannel('${channel.downloadToken}')">
                            <i class="fas fa-${channel.isActive ? 'pause' : 'play'}"></i>
                            ${channel.isActive ? 'Disable' : 'Enable'}
                        </button>
                        <button class="btn btn-danger btn-sm" onclick="deleteChannel('${channel.downloadToken}')">
                            <i class="fas fa-trash"></i>
                            Delete
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Channel management functions
        function showAddChannelModal() {
            const channelId = prompt('Enter Channel ID:');
            if (!channelId) return;
            
            const channelName = prompt('Enter Channel Name:');
            if (!channelName) return;
            
            const channelUsername = prompt('Enter Channel Username (optional):') || '';
            
            addChannel(channelId, channelName, channelUsername);
        }

        async function addChannel(channelId, channelName, channelUsername) {
            try {
                showLoading('Adding channel...');
                
                const response = await apiCall('/api/channels', {
                    method: 'POST',
                    body: JSON.stringify({
                        channelId,
                        channelName,
                        channelUsername
                    })
                });
                
                hideLoading();
                
                if (!response) return;
                
                const data = await response.json();
                
                if (data.success) {
                    showAlert('Channel added successfully!', 'success');
                    loadChannels();
                } else {
                    showAlert(data.message || 'Failed to add channel', 'error');
                }
            } catch (error) {
                hideLoading();
                showAlert('Error adding channel: ' + error.message, 'error');
            }
        }

        async function toggleChannel(token) {
            try {
                const response = await apiCall(`/api/channels/${token}/toggle`, {
                    method: 'PUT'
                });
                
                if (!response) return;
                
                const data = await response.json();
                
                if (data.success) {
                    showAlert(data.message, 'success');
                    loadChannels();
                } else {
                    showAlert(data.message || 'Failed to toggle channel', 'error');
                }
            } catch (error) {
                showAlert('Error toggling channel: ' + error.message, 'error');
            }
        }

        async function deleteChannel(token) {
            if (!confirm('Are you sure you want to delete this channel?')) return;
            
            try {
                const response = await apiCall(`/api/channels/${token}`, {
                    method: 'DELETE'
                });
                
                if (!response) return;
                
                const data = await response.json();
                
                if (data.success) {
                    showAlert('Channel deleted successfully!', 'success');
                    loadChannels();
                } else {
                    showAlert(data.message || 'Failed to delete channel', 'error');
                }
            } catch (error) {
                showAlert('Error deleting channel: ' + error.message, 'error');
            }
        }

        function copyDownloadLink(token) {
            const link = `${window.location.origin}/d/${token}`;
            navigator.clipboard.writeText(link).then(() => {
                showAlert('Download link copied to clipboard!', 'success');
            }).catch(() => {
                // Fallback for older browsers
                const textArea = document.createElement('textarea');
                textArea.value = link;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                showAlert('Download link copied to clipboard!', 'success');
            });
        }

        // App management functions
        function downloadApp(platform) {
            window.open(`/download/latest/${platform}`, '_blank');
        }

        function viewVersions(appName) {
            window.open(`/api/versions/${appName}`, '_blank');
        }

        function formatFileSize(bytes) {
            if (!bytes) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // Initialize application
        document.addEventListener('DOMContentLoaded', async () => {
            // Check authentication
            if (!AuthManager.isAuthenticated()) {
                AuthManager.redirectToLogin();
                return;
            }
            
            // Initialize upload manager
            new UploadManager();
            
            // Load initial data
            await Promise.all([
                loadApps(),
                loadChannels()
            ]);
            
            // Logout button
            document.getElementById('logoutBtn').addEventListener('click', async () => {
                try {
                    await apiCall('/api/auth/logout', { method: 'POST' });
                } catch (error) {
                    console.error('Logout error:', error);
                }
                
                AuthManager.clearAuth();
                AuthManager.redirectToLogin();
            });
        });
    </script>
</body>
</html>
