version: '3.8'

services:
  # MongoDB Atlas - No local MongoDB needed
  # mongodb service removed - using MongoDB Atlas cloud database

  # Main Application
  link-server:
    build: .
    container_name: link-server-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      
      # File Upload Configuration
      - MAX_FILE_SIZE=104857600
      
      # Rate Limiting Configuration
      - RATE_LIMIT_WINDOW=900000
      - RATE_LIMIT_MAX=50
      - REQUIRE_DEVICE_REGISTRATION=true
      - ENABLE_ANALYTICS=true
      
      # App Store Configuration
      - IOS_APP_STORE_URL=https://apps.apple.com/app/id123456789
      - ANDROID_PLAY_STORE_URL=https://play.google.com/store/apps/details?id=com.yourapp
      - IOS_APP_STORE_ID=123456789
      
      # CORS Configuration
      - CORS_ORIGINS=*
      
      # Admin Authentication Configuration
      - ADMIN_USERNAME=admin@brighthex.in
      - ADMIN_PASSWORD=$$2b$$12$$YourHashedPasswordHere
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production-docker-2024
      - JWT_EXPIRES_IN=24h
      - SESSION_TIMEOUT=86400000
      - MAX_LOGIN_ATTEMPTS=5
      - LOCKOUT_DURATION=900000
      
      # MongoDB Atlas Configuration
      - MONGODB_URI=mongodb+srv://brighthex28_db_user:paxb1lgQ9oT4Wrob@cluster0.lzhww6m.mongodb.net/linkserver?retryWrites=true&w=majority&appName=Cluster0
      - MONGODB_DB_NAME=linkserver
      
      # Base URL for production (optional)
      # - BASE_URL=https://yourdomain.com
    volumes:
      - apk_storage:/app/uploads
      - ./uploads:/app/uploads-local
    # No dependencies needed - using MongoDB Atlas
    restart: unless-stopped
    networks:
      - link-server-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Add SSL certificates if using HTTPS
      # - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - link-server
    restart: unless-stopped
    networks:
      - link-server-network
    profiles:
      - production

# Named Volumes for Data Persistence
volumes:
  # MongoDB Atlas used - no local MongoDB volumes needed
  apk_storage:
    driver: local

# Networks
networks:
  link-server-network:
    driver: bridge
